<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#5a16a6;
    --bg-mid:#7b23c9;
    --bg-low:#4723c2;
    --glow:#ff4fe0;
    --ink:#ffffff;
    --mono:'Space Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --card-w:min(86vw, 360px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(70% 35% at 50% 0%, #b52fd8 0%, transparent 70%),
      radial-gradient(90% 50% at 15% 100%, #6b2cff 0%, transparent 70%),
      radial-gradient(60% 40% at 90% 60%, #a62ad4 0%, transparent 70%),
      linear-gradient(180deg, var(--bg-top), var(--bg-mid) 45%, var(--bg-low));
    background-attachment:fixed;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* drifting haze */
  .haze{position:fixed;inset:-20%;pointer-events:none;z-index:0;
    background:
      radial-gradient(30% 20% at 25% 30%, rgba(255,150,255,.22), transparent 70%),
      radial-gradient(25% 18% at 75% 70%, rgba(140,120,255,.22), transparent 70%);
    filter:blur(20px);animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(6%,-5%) rotate(6deg)}}

  /* ---------- list ---------- */
  .list{
    position:fixed;inset:0;z-index:1;overflow-y:auto;
    padding:calc(env(safe-area-inset-top,0px) + 28px) 0 calc(env(safe-area-inset-bottom,0px) + 48px);
    display:flex;flex-direction:column;align-items:center;gap:22px;
    transition:opacity .45s ease, filter .45s ease;
  }
  .list.hide{opacity:0;pointer-events:none;filter:blur(6px)}
  .hint{font-size:15px;opacity:.75;margin-bottom:4px;letter-spacing:.01em}

  /* ---------- card ---------- */
  .card{
    position:relative;width:var(--card-w);aspect-ratio:1.586;
    border-radius:18px;overflow:hidden;flex:none;
    container-type:inline-size;cursor:pointer;
    box-shadow:0 18px 40px rgba(25,0,70,.55), inset 0 0 0 1px rgba(255,255,255,.12);
    transition:transform .25s ease;
    user-select:none;
  }
  .list .card:active{transform:scale(.97)}
  .card:focus-visible{outline:3px solid #fff;outline-offset:4px}
  .card .bg{position:absolute;inset:0}
  .card .bg svg{width:100%;height:100%;display:block}
  .face{position:absolute;inset:0;padding:6cqw 6.5cqw}
  .name{position:absolute;left:6.5cqw;top:6cqw;font-weight:700;font-size:3.5cqw;letter-spacing:.12em}
  .bal{position:absolute;right:6.5cqw;top:5.4cqw;text-align:right;opacity:0;transition:opacity .4s}
  .bal small{display:block;font-size:2.3cqw;font-weight:600;letter-spacing:.12em;opacity:.8}
  .bal b{display:block;font-family:var(--mono);font-size:4.6cqw;font-weight:700;margin-top:.6cqw;font-variant-numeric:tabular-nums}
  .is-active .bal{opacity:1}
  .chiprow{position:absolute;left:6.5cqw;top:24cqw;display:flex;align-items:center;gap:2.6cqw}
  .chip{width:11cqw;height:8.4cqw;border-radius:1.8cqw;
    background:linear-gradient(135deg,#f6dc93,#d9a94c 50%,#f1cf7a);
    box-shadow:inset 0 0 0 .35cqw rgba(120,80,10,.25);position:relative;overflow:hidden}
  .chip::before{content:"";position:absolute;inset:22% 0;border-top:.35cqw solid rgba(120,80,10,.35);border-bottom:.35cqw solid rgba(120,80,10,.35)}
  .chip::after{content:"";position:absolute;inset:0 38%;border-left:.35cqw solid rgba(120,80,10,.35);border-right:.35cqw solid rgba(120,80,10,.35)}
  .nfc{width:5cqw;height:5cqw;opacity:.85}
  .num{position:absolute;left:6.5cqw;top:41cqw;font-family:var(--sans);font-weight:600;font-size:5.4cqw;letter-spacing:.09em;white-space:nowrap}
  .foot{position:absolute;left:6.5cqw;right:6.5cqw;bottom:5.4cqw;display:flex;align-items:flex-end;gap:7cqw}
  .foot small{display:block;font-size:2.2cqw;font-weight:600;letter-spacing:.1em;opacity:.7;margin-bottom:.8cqw}
  .foot b{display:block;font-size:3.1cqw;font-weight:700;letter-spacing:.06em}
  .net{margin-left:auto;font-size:4cqw;font-weight:700;letter-spacing:.02em;opacity:.95}

  /* Pearl — iridescent silver */
  .c-pearl{color:#57516a}
  .c-pearl .bg{background:
    radial-gradient(60% 80% at 20% 10%, rgba(255,255,255,.9), transparent 60%),
    conic-gradient(from 210deg at 72% 40%, #efe9fb, #dde5f8, #f7e2f0, #e1f2ee, #e9e1fa, #efe9fb)}
  .c-pearl .chip{filter:grayscale(1) brightness(1.15)}
  /* Nebula — deep navy & violet */
  .c-nebula{color:#fff}
  .c-nebula .bg{background:
    radial-gradient(55% 75% at 78% 30%, rgba(111,92,255,.55), transparent 65%),
    radial-gradient(70% 70% at 0% 100%, rgba(40,90,255,.45), transparent 65%),
    linear-gradient(160deg,#141c5c,#0a113e 60%,#11154a)}
  .c-nebula .chip{filter:grayscale(1) brightness(1.3)}
  /* Prism — low-poly purple */
  .c-prism{color:#fff}
  /* Jade — topographic green */
  .c-jade{color:#fff}
  .c-jade .bg{background:linear-gradient(140deg,#30b489,#1b8768 55%,#0f6a52)}
  /* Bloom — halftone pink */
  .c-bloom{color:#fff}
  .c-bloom .bg{background:
    radial-gradient(70% 90% at 0% 0%, rgba(255,190,120,.55), transparent 60%),
    linear-gradient(150deg,#ff5aa3,#e02c79 50%,#9b1666)}
  .c-bloom .num,.c-bloom .name{text-shadow:0 1px 0 rgba(120,0,60,.35)}
  /* ---------- top-up stage ---------- */
  .stage{position:fixed;inset:0;z-index:2;pointer-events:none}
  .stage.on{pointer-events:auto}
  .active{position:absolute;left:0;top:0;will-change:transform;
    transition:transform .85s cubic-bezier(.2,.8,.2,1)}
  .active .card{cursor:default}
  .active .card.hit{animation:hit .35s ease}
  @keyframes hit{
    0%{box-shadow:0 18px 40px rgba(25,0,70,.55),0 0 0 0 rgba(255,79,224,0)}
    40%{box-shadow:0 18px 40px rgba(25,0,70,.55),0 0 38px 8px rgba(255,79,224,.75)}
    100%{box-shadow:0 18px 40px rgba(25,0,70,.55),0 0 0 0 rgba(255,79,224,0)}}
  .active.final .card{box-shadow:0 26px 60px rgba(25,0,70,.6),0 0 60px 6px rgba(255,79,224,.45)}

  .orbs{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);height:0;opacity:0;transition:opacity .6s}
  .stage.on .orbs{opacity:1}
  .stage.done .orbs{opacity:0}
  .orb{position:absolute;width:46px;height:20px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,#ffd0fb,#ff4fe0 45%,rgba(255,79,224,0));
    filter:blur(2px);animation:pulse 1.4s ease-in-out infinite}
  .orb:nth-child(2){animation-delay:.4s}.orb:nth-child(3){animation-delay:.8s}
  @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.35);opacity:.7}}

  /* flying numbers — bigger and glowing */
  .fly{position:absolute;left:0;top:0;white-space:nowrap;
    font-family:var(--mono);font-weight:700;font-size:clamp(34px, 10vw, 46px);line-height:1;
    color:#fff;letter-spacing:.01em;
    text-shadow:0 0 10px rgba(255,79,224,.95),0 0 26px rgba(170,90,255,.8),0 2px 0 rgba(60,0,90,.6);
    will-change:transform,opacity}
  .fly::before,.fly::after{content:attr(data-t);position:absolute;left:0;top:0}
  .fly::before{transform:translate(-3px,7px);color:rgba(255,255,255,.32);text-shadow:none}
  .fly::after{color:#6ff2ff;opacity:.45;mix-blend-mode:screen;text-shadow:none;animation:jit .16s steps(2) infinite}
  @keyframes jit{0%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}100%{transform:translate(1px,0)}}
  .dot{position:absolute;left:0;top:0;width:5px;height:5px;border-radius:50%;
    background:#ffd6fb;box-shadow:0 0 8px 2px rgba(255,79,224,.8);
    animation:dot .9s ease-out forwards}
  @keyframes dot{to{opacity:0;scale:.2}}

  .again{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);
    width:68px;height:68px;border-radius:50%;border:0;padding:0;
    display:grid;place-items:center;color:#3b0d6e;background:#fff;
    transform:translate(-50%,20px) scale(.6);opacity:0;pointer-events:none;cursor:pointer;
    box-shadow:0 10px 30px rgba(40,0,90,.45),0 0 0 8px rgba(255,255,255,.12);
    transition:opacity .35s, transform .45s cubic-bezier(.3,1.6,.5,1)}
  .again svg{width:34px;height:34px}
  .again .tick{stroke-dasharray:24;stroke-dashoffset:24}
  .again.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
  .again.show .tick{transition:stroke-dashoffset .45s .25s ease-out;stroke-dashoffset:0}
  .again:active{transform:translate(-50%,0) scale(.92)}
  .again:focus-visible{outline:3px solid #ffd27a;outline-offset:3px}

  canvas#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

  @media (prefers-reduced-motion: reduce){
    .haze,.orb,.fly::after{animation:none}
  }
</style>
</head>
<body>
<div class="haze" aria-hidden="true"></div>

<main class="list" id="list">
  <p class="hint">Tap a card to top up</p>
</main>

<section class="stage" id="stage" aria-live="polite">
  <div class="orbs" id="orbs"><span class="orb" style="left:22%"></span><span class="orb" style="left:50%"></span><span class="orb" style="left:80%"></span></div>
  <button class="again" id="again" type="button" aria-label="Done, back to cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path class="tick" d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
</section>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  const NFC = '<svg class="nfc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 8.5a5 5 0 0 1 0 7"/><path d="M12 6a8.5 8.5 0 0 1 0 12"/><path d="M16 3.5a12 12 0 0 1 0 17"/></svg>';

  // seeded random so every card looks the same on each load
  const seeded = s => () => { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const svgWrap = inner => `<svg viewBox="0 0 340 214" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">${inner}</svg>`;

  // Pearl: flowing satin waves
  const pearlBg = svgWrap(`<g fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.1">
    ${Array.from({length:12},(_,i)=>{const y=60+i*11;return `<path d="M-10 ${y} C 90 ${y-40}, 200 ${y+45}, 350 ${y-18}"/>`}).join('')}
  </g><g fill="none" stroke="rgba(160,140,210,.22)" stroke-width="1">
    ${Array.from({length:12},(_,i)=>{const y=63+i*11;return `<path d="M-10 ${y} C 90 ${y-40}, 200 ${y+45}, 350 ${y-18}"/>`}).join('')}
  </g>`);

  // Nebula: stars + ringed planet
  const nebulaBg = (() => {
    const r = seeded(7);
    const stars = Array.from({length:70},()=>`<circle cx="${(r()*340).toFixed(1)}" cy="${(r()*214).toFixed(1)}" r="${(r()*1.1+.25).toFixed(2)}" fill="#fff" opacity="${(r()*.7+.2).toFixed(2)}"/>`).join('');
    return svgWrap(`<defs>
      <radialGradient id="nb-p" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#c9d4ff"/><stop offset=".45" stop-color="#7a6bff"/><stop offset="1" stop-color="#2a1f8a"/></radialGradient>
      <filter id="nb-g"><feGaussianBlur stdDeviation="6"/></filter>
      <clipPath id="nb-front"><rect x="0" y="78" width="340" height="140"/></clipPath>
    </defs>${stars}
    <circle cx="262" cy="78" r="40" fill="#7a6bff" opacity=".55" filter="url(#nb-g)"/>
    <ellipse cx="262" cy="78" rx="66" ry="14" fill="none" stroke="rgba(200,190,255,.55)" stroke-width="3" transform="rotate(-18 262 78)"/>
    <circle cx="262" cy="78" r="34" fill="url(#nb-p)"/>
    <g clip-path="url(#nb-front)"><ellipse cx="262" cy="78" rx="66" ry="14" fill="none" stroke="rgba(220,215,255,.85)" stroke-width="3" transform="rotate(-18 262 78)"/></g>`);
  })();

  // Prism: low-poly facets in purples and magenta
  const prismBg = (() => {
    const r = seeded(21), cols = 8, rows = 5, pts = [];
    for (let y=0;y<=rows;y++){ pts[y]=[]; for (let x=0;x<=cols;x++){
      const jx = (x===0||x===cols)?0:(r()-.5)*30, jy=(y===0||y===rows)?0:(r()-.5)*26;
      pts[y][x]=[x*340/cols+jx, y*214/rows+jy]; } }
    const shade = (cx,cy) => {
      const t = Math.min(1, Math.max(0, (cx/340)*.55 + (1-cy/214)*.45 + (r()-.5)*.25));
      const a=[34,12,96], b=[124,44,214], c=[214,64,224];
      const m = t<.75 ? a.map((v,i)=>v+(b[i]-v)*(t/.75)) : b.map((v,i)=>v+(c[i]-v)*((t-.75)/.25));
      return `rgb(${m.map(v=>v|0).join(',')})`;
    };
    let tri = '';
    for (let y=0;y<rows;y++) for (let x=0;x<cols;x++){
      const p=pts[y][x], q=pts[y][x+1], s=pts[y+1][x], u=pts[y+1][x+1];
      const flip = (x+y)%2;
      const A = flip?[p,q,u]:[p,q,s], B = flip?[p,u,s]:[q,u,s];
      for (const T of [A,B]){
        const cx=(T[0][0]+T[1][0]+T[2][0])/3, cy=(T[0][1]+T[1][1]+T[2][1])/3;
        tri += `<polygon points="${T.map(v=>v.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="${shade(cx,cy)}" stroke="rgba(255,255,255,.08)" stroke-width=".6"/>`;
      }
    }
    return svgWrap(tri + `<rect width="340" height="214" fill="url(#pr-v)"/><defs><linearGradient id="pr-v" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#1a0850" stop-opacity="0"/><stop offset="1" stop-color="#1a0850" stop-opacity=".55"/></linearGradient></defs>`);
  })();

  // Jade: topographic contour lines
  const jadeBg = (() => {
    const r = seeded(3);
    const ph = [r()*6, r()*6, r()*6];
    let paths = '';
    for (let k=1;k<=11;k++){
      const R = k*17; let d='';
      for (let i=0;i<=72;i++){
        const a = i/72*Math.PI*2;
        const n = 1 + .16*Math.sin(3*a+ph[0]) + .1*Math.sin(5*a+ph[1]+k*.25) + .06*Math.sin(7*a+ph[2]);
        const x = 255 + Math.cos(a)*R*n*1.25, y = 150 + Math.sin(a)*R*n;
        d += (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
      }
      paths += `<path d="${d}Z" opacity="${k%4===0?1:.6}"/>`;
    }
    return svgWrap(`<g fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1">${paths}</g>`);
  })();

  // Bloom: halftone dots growing toward a corner
  const bloomBg = (() => {
    let dots = '';
    for (let y=8;y<214;y+=11) for (let x=8;x<340;x+=11){
      const off = (Math.round(y/11)%2)*5.5;
      const dx = x+off-340, dy = y-214, d = Math.hypot(dx,dy);
      const rr = Math.max(0, 4.2 - d/58);
      if (rr>.3) dots += `<circle cx="${(x+off).toFixed(1)}" cy="${y}" r="${rr.toFixed(2)}"/>`;
    }
    return svgWrap(`<g fill="rgba(255,255,255,.28)">${dots}</g>`);
  })();

  const CARDS = [
    {id:'pearl',  name:'PEARL',  num:'5416 2907 1128 8651', holder:'ULRIC CODROW',  exp:'04/29', net:'credit', bg:pearlBg},
    {id:'nebula', name:'NEBULA', num:'5348 1431 6711 3018', holder:'WYNN VASHOW',   exp:'04/28', net:'debit',  bg:nebulaBg},
    {id:'prism',  name:'PRISM',  num:'5426 1052 4293 1525', holder:'LIVENA KETTEK', exp:'04/32', net:'debit',  bg:prismBg},
    {id:'jade',   name:'JADE',   num:'4750 3864 0143 3074', holder:'NEVE WRENKO',   exp:'06/32', net:'credit', bg:jadeBg},
    {id:'bloom',  name:'BLOOM',  num:'4921 7730 5512 0846', holder:'MIRA OSTEVAL',  exp:'11/30', net:'debit',  bg:bloomBg},
  ];
  const cardHTML = c => `
    <div class="bg">${c.bg}</div>
    <div class="face">
      <span class="name">${c.name}</span>
      <div class="bal"><small>BALANCE</small><b>0.00</b></div>
      <div class="chiprow"><div class="chip"></div>${NFC}</div>
      <div class="num">${c.num}</div>
      <div class="foot">
        <div><small>CARD HOLDER</small><b>${c.holder}</b></div>
        <div><small>VALID THRU</small><b>${c.exp}</b></div>
        <span class="net">${c.net}</span>
      </div>
    </div>`;

  const list = document.getElementById('list');
  const stage = document.getElementById('stage');
  const again = document.getElementById('again');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  CARDS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card c-' + c.id;
    el.tabIndex = 0;
    el.setAttribute('role','button');
    el.setAttribute('aria-label', 'Top up card ' + c.name);
    el.innerHTML = cardHTML(c);
    el.addEventListener('click', () => start(el));
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); start(el); } });
    list.appendChild(el);
  });

  const fmt = v => v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a,b) => a + Math.random()*(b-a);

  let running = false, wrap = null, runId = 0;

  function setPos(el, x, y, s=1){ el.style.transform = `translate(${x}px,${y}px) scale(${s})`; }

  async function start(srcCard){
    if (running) return;
    running = true;
    const id = ++runId;
    const r = srcCard.getBoundingClientRect();

    wrap = document.createElement('div');
    wrap.className = 'active';
    const card = srcCard.cloneNode(true);
    card.classList.add('is-active');
    card.removeAttribute('tabindex'); card.removeAttribute('role');
    wrap.appendChild(card);
    wrap.style.transition = 'none';
    setPos(wrap, r.left, r.top);
    stage.insertBefore(wrap, stage.firstChild);
    stage.classList.add('on'); stage.classList.remove('done');
    list.classList.add('hide');

    const W = innerWidth, H = innerHeight;
    const cw = r.width, ch = r.height;
    const safeTop = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    const topX = (W - cw)/2, topY = safeTop + 22;

    await wait(30);
    wrap.style.transition = '';
    setPos(wrap, topX, topY);
    await wait(reduce ? 200 : 900);

    // flying numbers
    const balEl = card.querySelector('.bal b');
    let balance = 0, shown = 0, tweenRaf = 0;
    const tweenTo = target => {
      cancelAnimationFrame(tweenRaf);
      const from = shown, t0 = performance.now(), dur = 520;
      const step = now => {
        const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
        shown = from + (target-from)*e;
        balEl.textContent = fmt(shown);
        if (k<1) tweenRaf = requestAnimationFrame(step);
      };
      tweenRaf = requestAnimationFrame(step);
    };

    const orbXs = [.22,.5,.8].map(f => f*W);
    const startY = H - (parseFloat(getComputedStyle(document.body).paddingBottom)||0) - 50;
    const targetY = topY + ch*0.5;
    const COUNT = 12;
    const flights = [];

    for (let i=0;i<COUNT;i++){
      if (id !== runId) return;
      const amt = Math.round(rand(80, 560)*100)/100;
      const sx = orbXs[i%3] + rand(-14,14);
      const tx = W/2 + rand(-cw*0.22, cw*0.22);
      flights.push(fly(amt, sx, startY, tx, targetY, () => {
        balance += amt; tweenTo(balance);
        card.classList.remove('hit'); void card.offsetWidth; card.classList.add('hit');
      }));
      await wait(reduce ? 120 : 470);
    }
    await Promise.all(flights);
    await wait(650);
    if (id !== runId) return;

    // finale: card to centre + confetti
    stage.classList.add('done');
    wrap.classList.add('final');
    setPos(wrap, topX, (H - ch)/2 - 30, 1.06);
    await wait(reduce ? 200 : 650);
    const cx = W/2, cy = (H)/2 - 30;
    confetti(cx, cy);
    again.classList.add('show');
    again.focus({preventScroll:true});
  }

  function fly(amount, sx, sy, tx, ty, onArrive){
    return new Promise(res => {
      const el = document.createElement('div');
      el.className = 'fly';
      const t = '+' + fmt(amount);
      el.textContent = t; el.dataset.t = t;
      stage.appendChild(el);
      const w = el.offsetWidth, h = el.offsetHeight;
      const dur = reduce ? 500 : rand(1500, 1900);
      const sway = rand(-20, 20);
      const t0 = performance.now();
      let lastDot = 0;
      const step = now => {
        const k = Math.min(1,(now-t0)/dur);
        const e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
        const x = sx + (tx-sx)*e + Math.sin(k*Math.PI)*sway;
        const y = sy + (ty-sy)*e;
        const s = k < .85 ? 1 : 1 - (k-.85)/.15*0.65;
        const o = k < .08 ? k/.08 : (k < .88 ? 1 : 1-(k-.88)/.12);
        el.style.transform = `translate(${x - w/2}px,${y - h/2}px) scale(${s})`;
        el.style.opacity = o;
        if (!reduce && now - lastDot > 55 && k < .85){
          lastDot = now;
          const d = document.createElement('span');
          d.className = 'dot';
          d.style.transform = `translate(${x + rand(-w*.3,w*.3)}px,${y + h*.6}px)`;
          stage.appendChild(d);
          d.addEventListener('animationend', () => d.remove());
        }
        if (k<1) requestAnimationFrame(step);
        else { el.remove(); onArrive(); res(); }
      };
      requestAnimationFrame(step);
    });
  }

  again.addEventListener('click', () => {
    runId++;
    again.classList.remove('show');
    stage.classList.remove('on','done');
    stage.querySelectorAll('.fly,.dot').forEach(n => n.remove());
    if (wrap){
      const w = wrap; wrap = null;
      w.style.transition = 'opacity .4s, transform .4s';
      w.style.opacity = '0';
      setTimeout(() => w.remove(), 420);
    }
    list.classList.remove('hide');
    running = false;
  });

  /* ---------- confetti ---------- */
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  const COLORS = ['#ffd27a','#ff4fe0','#6ff2ff','#a77bff','#ffffff','#5be3b0','#ff7a6b'];
  let parts = [], craf = 0;

  function resize(){
    const dpr = Math.min(devicePixelRatio||1, 2);
    cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', resize); resize();

  function piece(x, y, angle, speed){
    return {
      x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      w: rand(7,13), h: rand(4,8),
      rot: rand(0,Math.PI*2), vr: rand(-.25,.25),
      tilt: rand(0,Math.PI*2), vt: rand(.08,.2),
      color: COLORS[(Math.random()*COLORS.length)|0],
      round: Math.random() < .25
    };
  }

  function confetti(cx, cy){
    const W = innerWidth, H = innerHeight;
    const n = reduce ? 60 : 1;
    // burst from the card
    for (let i=0;i<(reduce?60:160);i++) parts.push(piece(cx, cy, rand(0,Math.PI*2), rand(4,15)));
    if (!reduce){
      // side cannons
      for (let i=0;i<90;i++){
        parts.push(piece(0, H*0.9, rand(-Math.PI*0.42,-Math.PI*0.18), rand(12,22)));
        parts.push(piece(W, H*0.9, rand(-Math.PI*0.82,-Math.PI*0.58), rand(12,22)));
      }
      // gentle rain from the top
      let k = 0;
      const rain = setInterval(() => {
        for (let i=0;i<8;i++) parts.push(piece(rand(0,W), -20, Math.PI/2, rand(1,3)));
        if (++k > 18) clearInterval(rain);
      }, 90);
    }
    if (!craf) craf = requestAnimationFrame(tick);
  }

  let last = 0;
  function tick(now){
    const dt = last ? Math.min(2, (now-last)/16.67) : 1; last = now;
    const H = innerHeight;
    ctx.clearRect(0,0,innerWidth,H);
    parts = parts.filter(p => p.y < H + 40);
    for (const p of parts){
      p.vx *= Math.pow(.985, dt); p.vy = p.vy*Math.pow(.985, dt) + .32*dt;
      if (p.vy > 5.5) p.vy = 5.5;
      p.x += (p.vx + Math.sin(p.tilt)*.6)*dt; p.y += p.vy*dt;
      p.rot += p.vr*dt; p.tilt += p.vt*dt;
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      const sx = Math.cos(p.tilt);
      if (p.round){ ctx.beginPath(); ctx.ellipse(0,0,p.h*.7*Math.abs(sx)+.5,p.h*.7,0,0,Math.PI*2); ctx.fill(); }
      else ctx.fillRect(-p.w/2*sx, -p.h/2, p.w*sx, p.h);
      ctx.restore();
    }
    if (parts.length) craf = requestAnimationFrame(tick);
    else { craf = 0; last = 0; ctx.clearRect(0,0,innerWidth,H); }
  }
})();
</script>
</body>
</html>
